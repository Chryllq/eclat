<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ÉCLAT TOKYO</title>

    <style>
        body {
            margin: 0;
            background: #050505;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        header {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 60px;
            border-bottom: 1px solid #222;
        }

        .logo {
            font-size: 28px;
            letter-spacing: 8px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 35px;
            font-size: 12px;
            letter-spacing: 2px;
        }

        .hero {
            height: 700px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-image: url("hero.png");
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .hero-image {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }
        .hero h1 {
            font-size: 100px;
            letter-spacing: 25px;
            margin: 0;
        }

        .hero p {
            margin-top: 25px;
            font-size: 13px;
            letter-spacing: 5px;
            color: #999;
        }

        .concept {
            padding: 120px 20%;
            text-align: center;
            border-top: 1px solid #222;
        }

        .concept h2 {
            font-size: 14px;
            letter-spacing: 5px;
        }

        .concept p {
            font-size: 18px;
            line-height: 2.2;
            color: #aaa;
        }
  .collection {
    padding: 120px 8%;
    background: #050505;
    text-align: center;
}

.collection h2 {
    font-size: 14px;
    letter-spacing: 5px;
    margin-bottom: 70px;
}

.products {
    display: flex;
    gap: 30px;
    justify-content: center;
}

.product {
    width: 30%;
}

.product-image {
    height: 420px;
    background: #111;
    border: 1px solid #222;
    margin-bottom: 25px;
}

.product h3 {
    font-size: 12px;
    letter-spacing: 3px;
    font-weight: normal;
}

.product p {
    font-size: 12px;
    color: #777;
    letter-spacing: 2px;
}  
</style>
</head>

<body>

<header>
    <div class="logo">ÉCLAT</div>

    <nav>
        <span>COLLECTION</span>
        <span>ABOUT</span>
        <span>CONTACT</span>
    </nav>
</header>

<section class="hero">
    <img src="hero.png" class="hero-image">
    
</section>

<section class="collection">
    <h2>COLLECTION</h2>

    <div class="products">
        <div class="product">
            <div class="product-image"></div>
            <h3>ÉCLAT BLACK JACKET</h3>
            <p>¥48,000</p>
        </div>

        <div class="product">
            <div class="product-image"></div>
            <h3>SILVER CROSS NECKLACE</h3>
            <p>¥32,000</p>
        </div>

        <div class="product">
            <div class="product-image"></div>
            <h3>ÉCLAT WIDE PANTS</h3>
            <p>¥38,000</p>
        </div>
    </div>
</section>

<section class="concept">
    <h2>PHILOSOPHY</h2>

    <p>
        誰かの正解を生きるな。<br>
        自分だけの輪郭を持て。<br>
        唯一無二であれ。
    </p>
</section>

</body>
</html>
